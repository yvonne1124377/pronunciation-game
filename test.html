<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Pronunciation Test - the</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 15px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #222;
      text-align: center;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    }

    h1 {
      margin-top: 0;
      font-size: 30px;
    }

    .url-box {
      margin-bottom: 25px;
      padding: 18px;
      background: #f3f4f6;
      border-radius: 14px;
      text-align: left;
    }

    .url-box label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .url-row {
      display: flex;
      gap: 8px;
    }

    #functionUrl {
      flex: 1;
      padding: 11px;
      border: 1px solid #bbb;
      border-radius: 8px;
      font-size: 14px;
    }

    .save-button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: #444;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .target-label {
      margin-top: 20px;
      font-size: 18px;
      color: #666;
    }

    .target-word {
      margin: 10px 0 25px;
      font-size: 80px;
      font-weight: bold;
    }

    .record-button,
    .stop-button {
      border: none;
      border-radius: 30px;
      padding: 14px 28px;
      margin: 7px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .record-button {
      background: #222;
      color: white;
    }

    .stop-button {
      background: #f4a3a3;
      color: white;
    }

    button:disabled {
      opacity: 0.45;
      cursor: default;
    }

    #status {
      margin-top: 20px;
      min-height: 30px;
      font-size: 19px;
      font-weight: bold;
    }

    .recording {
      color: #d32f2f;
    }

    .result-banner {
      display: none;
      margin-top: 22px;
      padding: 20px;
      border-radius: 16px;
      font-size: 30px;
      font-weight: bold;
    }

    .pass {
      display: block;
      background: #dcfce7;
      color: #166534;
      border: 2px solid #22c55e;
    }

    .fail {
      display: block;
      background: #fee2e2;
      color: #991b1b;
      border: 2px solid #ef4444;
    }

    .result-subtext {
      margin-top: 7px;
      font-size: 17px;
      font-weight: normal;
    }

    .results {
      display: none;
      margin-top: 25px;
      text-align: left;
    }

    .score-box {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 15px;
    }

    .score {
      padding: 18px 10px;
      background: #f3f4f6;
      border-radius: 14px;
      text-align: center;
    }

    .score-number {
      display: block;
      margin-top: 5px;
      font-size: 32px;
      font-weight: bold;
    }

    .recognized {
      margin-top: 20px;
      padding: 15px;
      background: #f7f7f7;
      border-radius: 12px;
      font-size: 17px;
    }

    .phoneme-title {
      margin-top: 25px;
      font-size: 21px;
      font-weight: bold;
    }

    .phoneme {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      padding: 15px 20px;
      background: #f3f4f6;
      border-radius: 12px;
    }

    .phoneme-symbol {
      font-size: 30px;
      font-weight: bold;
    }

    .phoneme-score {
      font-size: 22px;
      font-weight: bold;
    }

    .phoneme-good {
      border-left: 7px solid #22c55e;
    }

    .phoneme-bad {
      border-left: 7px solid #ef4444;
    }

    .threshold-box {
      margin-top: 18px;
      padding: 14px;
      background: #fff7ed;
      border-radius: 12px;
      color: #7c2d12;
      font-size: 15px;
      line-height: 1.5;
    }

    .error {
      display: none;
      margin-top: 15px;
      padding: 15px;
      border-radius: 10px;
      background: #ffe5e5;
      color: #a00000;
      word-break: break-word;
    }

    .debug-box {
      margin-top: 30px;
      text-align: left;
    }

    .debug-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    #rawResponse {
      white-space: pre-wrap;
      word-break: break-word;
      background: #1f1f1f;
      color: #f1f1f1;
      padding: 16px;
      border-radius: 10px;
      font-family: Consolas, monospace;
      font-size: 13px;
      max-height: 350px;
      overflow: auto;
    }

    .note {
      margin-top: 25px;
      color: #666;
      line-height: 1.6;
      font-size: 15px;
    }

    @media (max-width: 550px) {

      .container {
        padding: 20px;
      }

      .target-word {
        font-size: 65px;
      }

      .score-box {
        grid-template-columns: 1fr;
      }

      .url-row {
        flex-direction: column;
      }

    }

  </style>

</head>

<body>

<div class="container">

  <h1>🎤 Pronunciation Test</h1>


  <div class="url-box">

    <label>
      Azure Function URL
    </label>

    <div class="url-row">

      <input
        id="functionUrl"
        type="text"
        placeholder="https://...azurewebsites.net/api/pronunciation"
      >

      <button
        id="saveUrlButton"
        class="save-button"
      >
        Save URL
      </button>

    </div>

  </div>


  <div class="target-label">
    Say this word:
  </div>


  <div class="target-word">
    the
  </div>


  <button
    id="recordButton"
    class="record-button"
  >
    🎤 Start Recording
  </button>


  <button
    id="stopButton"
    class="stop-button"
    disabled
  >
    ■ Stop & Score
  </button>


  <div id="status">
    Press Start Recording.
  </div>


  <div
    id="resultBanner"
    class="result-banner"
  >
  </div>


  <div
    id="results"
    class="results"
  >

    <div class="score-box">

      <div class="score">
        Pronunciation
        <span
          id="pronScore"
          class="score-number"
        >
          -
        </span>
      </div>


      <div class="score">
        Accuracy
        <span
          id="accuracyScore"
          class="score-number"
        >
          -
        </span>
      </div>

    </div>


    <div
      id="recognized"
      class="recognized"
    >
    </div>


    <div class="phoneme-title">
      Phoneme scores
    </div>


    <div id="phonemes"></div>


    <div class="threshold-box">

      PASS requirement:<br>

      Accuracy ≥ <b>90</b><br>

      Every phoneme ≥ <b>85</b>

    </div>

  </div>


  <div
    id="errorBox"
    class="error"
  >
  </div>


  <div class="debug-box">

    <div class="debug-title">
      Azure Raw Response
    </div>

    <div id="rawResponse">
      No response yet.
    </div>

  </div>


  <div class="note">
    Pronounce the word naturally.
    If you do not reach the target,
    try again.
  </div>

</div>


<script>

const TARGET_WORD = "the";

const TARGET_SAMPLE_RATE = 16000;

const MIN_ACCURACY = 90;

const MIN_PHONEME_SCORE = 85;


let audioContext = null;
let microphoneStream = null;
let sourceNode = null;
let processorNode = null;

let audioChunks = [];

let inputSampleRate = 44100;

let recording = false;


const functionUrlInput =
  document.getElementById("functionUrl");

const saveUrlButton =
  document.getElementById("saveUrlButton");

const recordButton =
  document.getElementById("recordButton");

const stopButton =
  document.getElementById("stopButton");

const statusBox =
  document.getElementById("status");

const resultsBox =
  document.getElementById("results");

const errorBox =
  document.getElementById("errorBox");

const rawResponseBox =
  document.getElementById("rawResponse");

const resultBanner =
  document.getElementById("resultBanner");



function loadSavedUrl() {

  const saved =
    localStorage.getItem(
      "pronunciationFunctionUrl"
    );

  if (saved) {
    functionUrlInput.value = saved;
  }

}



saveUrlButton.addEventListener(
  "click",
  function () {

    const url =
      functionUrlInput.value.trim();

    if (!url) {

      alert(
        "Please paste your Azure Function URL first."
      );

      return;
    }

    localStorage.setItem(
      "pronunciationFunctionUrl",
      url
    );

    alert(
      "Function URL saved."
    );

  }
);



recordButton.addEventListener(
  "click",
  startRecording
);



async function startRecording() {

  hideError();

  resultsBox.style.display =
    "none";

  resultBanner.className =
    "result-banner";

  resultBanner.innerHTML = "";

  rawResponseBox.textContent =
    "Waiting for response...";

  audioChunks = [];


  try {

    microphoneStream =
      await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl: false
        }
      });


    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();


    inputSampleRate =
      audioContext.sampleRate;


    sourceNode =
      audioContext.createMediaStreamSource(
        microphoneStream
      );


    processorNode =
      audioContext.createScriptProcessor(
        4096,
        1,
        1
      );


    processorNode.onaudioprocess =
      function (event) {

        if (!recording) {
          return;
        }

        const input =
          event
            .inputBuffer
            .getChannelData(0);

        audioChunks.push(
          new Float32Array(input)
        );

      };


    sourceNode.connect(
      processorNode
    );

    processorNode.connect(
      audioContext.destination
    );


    recording = true;

    recordButton.disabled = true;
    stopButton.disabled = false;

    statusBox.className =
      "recording";

    statusBox.textContent =
      "🔴 Recording... Say “the” once.";

  }

  catch (error) {

    showError(
      "Microphone error: " +
      error.message
    );

  }

}



stopButton.addEventListener(
  "click",
  stopRecording
);



async function stopRecording() {

  if (!recording) {
    return;
  }


  recording = false;

  recordButton.disabled = true;
  stopButton.disabled = true;

  statusBox.className = "";

  statusBox.textContent =
    "⏳ Preparing audio...";


  if (microphoneStream) {

    microphoneStream
      .getTracks()
      .forEach(
        track => track.stop()
      );

  }


  if (processorNode) {
    processorNode.disconnect();
  }

  if (sourceNode) {
    sourceNode.disconnect();
  }


  const combined =
    mergeBuffers(
      audioChunks
    );


  const downsampled =
    downsampleBuffer(
      combined,
      inputSampleRate,
      TARGET_SAMPLE_RATE
    );


  const wavBuffer =
    encodeWAV(
      downsampled,
      TARGET_SAMPLE_RATE
    );


  const base64Audio =
    arrayBufferToBase64(
      wavBuffer
    );


  if (audioContext) {
    await audioContext.close();
  }


  statusBox.textContent =
    "☁️ Sending pronunciation to Azure...";


  await sendToAzure(
    base64Audio
  );

}



function mergeBuffers(chunks) {

  let totalLength = 0;

  chunks.forEach(
    chunk => {
      totalLength += chunk.length;
    }
  );


  const result =
    new Float32Array(
      totalLength
    );


  let offset = 0;


  chunks.forEach(
    chunk => {

      result.set(
        chunk,
        offset
      );

      offset += chunk.length;

    }
  );


  return result;

}



function downsampleBuffer(
  buffer,
  sourceRate,
  targetRate
) {

  if (sourceRate === targetRate) {
    return buffer;
  }


  const ratio =
    sourceRate /
    targetRate;


  const newLength =
    Math.round(
      buffer.length /
      ratio
    );


  const result =
    new Float32Array(
      newLength
    );


  let resultIndex = 0;
  let bufferIndex = 0;


  while (
    resultIndex <
    result.length
  ) {

    const nextBufferIndex =
      Math.round(
        (resultIndex + 1) *
        ratio
      );


    let total = 0;
    let count = 0;


    for (
      let i = bufferIndex;
      i < nextBufferIndex &&
      i < buffer.length;
      i++
    ) {

      total += buffer[i];
      count++;

    }


    result[resultIndex] =
      count > 0
        ? total / count
        : 0;


    resultIndex++;

    bufferIndex =
      nextBufferIndex;

  }


  return result;

}



function encodeWAV(
  samples,
  sampleRate
) {

  const buffer =
    new ArrayBuffer(
      44 +
      samples.length * 2
    );


  const view =
    new DataView(
      buffer
    );


  writeString(
    view,
    0,
    "RIFF"
  );


  view.setUint32(
    4,
    36 +
    samples.length * 2,
    true
  );


  writeString(
    view,
    8,
    "WAVE"
  );


  writeString(
    view,
    12,
    "fmt "
  );


  view.setUint32(
    16,
    16,
    true
  );


  view.setUint16(
    20,
    1,
    true
  );


  view.setUint16(
    22,
    1,
    true
  );


  view.setUint32(
    24,
    sampleRate,
    true
  );


  view.setUint32(
    28,
    sampleRate * 2,
    true
  );


  view.setUint16(
    32,
    2,
    true
  );


  view.setUint16(
    34,
    16,
    true
  );


  writeString(
    view,
    36,
    "data"
  );


  view.setUint32(
    40,
    samples.length * 2,
    true
  );


  floatTo16BitPCM(
    view,
    44,
    samples
  );


  return buffer;

}



function floatTo16BitPCM(
  view,
  offset,
  samples
) {

  for (
    let i = 0;
    i < samples.length;
    i++,
    offset += 2
  ) {

    const sample =
      Math.max(
        -1,
        Math.min(
          1,
          samples[i]
        )
      );


    view.setInt16(
      offset,

      sample < 0
        ? sample * 0x8000
        : sample * 0x7fff,

      true
    );

  }

}



function writeString(
  view,
  offset,
  string
) {

  for (
    let i = 0;
    i < string.length;
    i++
  ) {

    view.setUint8(
      offset + i,
      string.charCodeAt(i)
    );

  }

}



function arrayBufferToBase64(
  buffer
) {

  const bytes =
    new Uint8Array(
      buffer
    );


  let binary = "";

  const chunkSize =
    0x8000;


  for (
    let i = 0;
    i < bytes.length;
    i += chunkSize
  ) {

    const chunk =
      bytes.subarray(
        i,
        Math.min(
          i + chunkSize,
          bytes.length
        )
      );


    binary +=
      String.fromCharCode.apply(
        null,
        chunk
      );

  }


  return btoa(
    binary
  );

}



async function sendToAzure(
  audioBase64
) {

  try {

    const functionUrl =
      functionUrlInput.value.trim();


    if (!functionUrl) {

      throw new Error(
        "Please enter your Azure Function URL."
      );

    }


    localStorage.setItem(
      "pronunciationFunctionUrl",
      functionUrl
    );


    const response =
      await fetch(
        functionUrl,
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              referenceText:
                TARGET_WORD,

              audioBase64:
                audioBase64
            })

        }
      );


    const responseText =
      await response.text();


    let data;


    try {

      data =
        JSON.parse(
          responseText
        );

    }

    catch {

      rawResponseBox.textContent =
        responseText;

      throw new Error(
        "Azure returned a response that was not JSON."
      );

    }


    rawResponseBox.textContent =
      JSON.stringify(
        data,
        null,
        2
      );


    if (!response.ok) {

      throw new Error(
        data.details ||
        data.error ||
        (
          "HTTP error " +
          response.status
        )
      );

    }


    if (!data.ok) {

      throw new Error(
        data.error ||
        "Pronunciation assessment failed."
      );

    }


    displayResults(
      data
    );

  }

  catch (error) {

    showError(
      error.message
    );


    statusBox.textContent =
      "❌ Test failed.";

  }


  recordButton.disabled =
    false;

}



function displayResults(data) {

  statusBox.textContent =
    "✅ Assessment complete!";


  document
    .getElementById(
      "pronScore"
    )
    .textContent =
      scoreText(
        data.pronunciationScore
      );


  document
    .getElementById(
      "accuracyScore"
    )
    .textContent =
      scoreText(
        data.accuracyScore
      );


  document
    .getElementById(
      "recognized"
    )
    .innerHTML =
      "<b>Azure heard:</b> " +
      escapeHTML(
        data.recognizedText ||
        "(nothing)"
      );


  const phonemeBox =
    document.getElementById(
      "phonemes"
    );


  phonemeBox.innerHTML = "";


  let allPhonemesPass =
    true;


  let phonemeCount =
    0;


  if (
    data.words &&
    data.words.length > 0
  ) {

    data.words.forEach(
      word => {

        if (!word.phonemes) {
          return;
        }


        word.phonemes.forEach(
          phoneme => {

            phonemeCount++;


            const phonemeScore =
              Number(
                phoneme.accuracyScore
              );


            const phonemePass =
              Number.isFinite(
                phonemeScore
              ) &&
              phonemeScore >=
                MIN_PHONEME_SCORE;


            if (!phonemePass) {
              allPhonemesPass =
                false;
            }


            const row =
              document.createElement(
                "div"
              );


            row.className =
              "phoneme " +
              (
                phonemePass
                  ? "phoneme-good"
                  : "phoneme-bad"
              );


            const symbol =
              document.createElement(
                "div"
              );


            symbol.className =
              "phoneme-symbol";


            symbol.textContent =
              phoneme.phoneme ||
              "?";


            const score =
              document.createElement(
                "div"
              );


            score.className =
              "phoneme-score";


            score.textContent =
              scoreText(
                phoneme.accuracyScore
              ) +
              " / 100";


            row.appendChild(
              symbol
            );


            row.appendChild(
              score
            );


            phonemeBox.appendChild(
              row
            );

          }
        );

      }
    );

  }


  if (
    phonemeBox.children.length === 0
  ) {

    phonemeBox.innerHTML =
      "<p>No phoneme scores returned.</p>";

    allPhonemesPass =
      false;

  }


  const accuracy =
    Number(
      data.accuracyScore
    );


  const accuracyPass =
    Number.isFinite(
      accuracy
    ) &&
    accuracy >=
      MIN_ACCURACY;


  const finalPass =
    accuracyPass &&
    allPhonemesPass &&
    phonemeCount > 0;


  showPassFail(
    finalPass
  );


  resultsBox.style.display =
    "block";

}



function showPassFail(
  passed
) {

  if (passed) {

    resultBanner.className =
      "result-banner pass";

    resultBanner.innerHTML =
      "PASS ✅" +
      "<div class='result-subtext'>" +
      "Great job!" +
      "</div>";

  }

  else {

    resultBanner.className =
      "result-banner fail";

    resultBanner.innerHTML =
      "TRY AGAIN ❌" +
      "<div class='result-subtext'>" +
      "Say the word again." +
      "</div>";

  }

}



function scoreText(score) {

  if (
    score === null ||
    score === undefined
  ) {

    return "-";

  }


  const number =
    Number(score);


  if (
    !Number.isFinite(number)
  ) {

    return "-";

  }


  return Math.round(
    number
  );

}



function escapeHTML(text) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text;


  return div.innerHTML;

}



function showError(message) {

  errorBox.style.display =
    "block";


  errorBox.textContent =
    message;


  recordButton.disabled =
    false;


  stopButton.disabled =
    true;

}



function hideError() {

  errorBox.style.display =
    "none";

  errorBox.textContent =
    "";

}



loadSavedUrl();

</script>

</body>

</html>
