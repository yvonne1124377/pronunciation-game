<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Pronunciation Mystery Picture</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      text-align: center;
      color: #222;
    }

    h1 {
      margin: 5px 0 8px;
    }

    .instructions {
      margin-bottom: 15px;
      font-size: 17px;
      color: #555;
      line-height: 1.5;
    }


    /* =========================
       按鈕
       ========================= */

    #startButton,
    #speakButton {

      padding: 13px 28px;

      border: none;

      border-radius: 30px;

      font-size: 18px;

      font-weight: bold;

      cursor: pointer;

      margin: 5px 5px 15px;

      transition:
        transform 0.2s ease,
        opacity 0.2s ease;
    }


    #startButton {

      background: #222;

      color: white;
    }


    #speakButton {

      display: none;

      background: #2563eb;

      color: white;
    }


    #speakButton.recording {

      background: #dc2626;
    }


    #startButton:hover,
    #speakButton:hover {

      transform: scale(1.03);
    }


    #startButton:disabled,
    #speakButton:disabled {

      opacity: 0.5;

      cursor: default;

      transform: none;
    }


    /* =========================
       目前任務
       ========================= */

    #currentTask {

      min-height: 42px;

      margin: 5px 0 8px;

      font-size: 23px;

      font-weight: bold;
    }


    /* =========================
       PASS / TRY AGAIN
       ========================= */

    #result {

      min-height: 42px;

      margin: 5px auto 12px;

      font-size: 28px;

      font-weight: bold;
    }


    .pass {

      color: #15803d;
    }


    .fail {

      color: #dc2626;
    }


    .checking {

      color: #555;
    }


    /* =========================
       遊戲區
       ========================= */

    #game {

      position: relative;

      display: grid;

      width: min(760px, 96vw);

      aspect-ratio: 3 / 2;

      margin: 0 auto;

      background-image:
        url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1400&q=85");

      background-size: cover;

      background-position: center;

      border-radius: 18px;

      overflow: hidden;

      box-shadow:
        0 8px 25px rgba(0,0,0,0.2);
    }


    /* =========================
       單字卡
       ========================= */

    .word-card {

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 5px;

      background: white;

      border: 1px solid #777;

      font-size: 18px;

      font-weight: bold;

      user-select: none;

      transition:
        opacity 0.45s ease,
        transform 0.25s ease,
        background 0.25s ease,
        box-shadow 0.25s ease;
    }


    /* =========================
       被抽中的單字
       ========================= */

    .word-card.active {

      background: #ffe45c;

      border: 4px solid #ff9800;

      transform: scale(1.08);

      box-shadow:
        0 0 18px rgba(255, 152, 0, 0.9);

      z-index: 10;
    }


    /* =========================
       PASS 後消失
       ========================= */

    .word-card.completed {

      opacity: 0;

      pointer-events: none;
    }


    /* =========================
       狀態
       ========================= */

    #message {

      min-height: 30px;

      margin-top: 14px;

      font-size: 18px;

      font-weight: bold;

      color: #444;
    }


    #progress {

      margin-top: 7px;

      font-size: 17px;

      font-weight: bold;
    }


    #warning {

      display: none;

      max-width: 700px;

      margin: 10px auto;

      padding: 12px;

      background: #ffe4e4;

      color: #a00000;

      border-radius: 10px;

      font-weight: bold;

      line-height: 1.5;
    }


    /* =========================
       完成畫面
       ========================= */

    #finishedMessage {

      display: none;

      max-width: 760px;

      margin: 18px auto 0;

      padding: 18px;

      background: #dcfce7;

      color: #166534;

      border-radius: 16px;

      font-size: 25px;

      font-weight: bold;
    }


    /* =========================
       手機
       ========================= */

    @media (max-width: 650px) {

      body {
        padding: 10px;
      }

      h1 {
        font-size: 23px;
      }

      .instructions {
        font-size: 15px;
      }

      .word-card {
        font-size: 13px;
        padding: 2px;
      }

      .word-card.active {
        transform: scale(1.05);
      }

      #currentTask {
        font-size: 19px;
      }

      #result {
        font-size: 24px;
      }

      #startButton,
      #speakButton {
        font-size: 16px;
        padding: 12px 22px;
      }

    }

  </style>

</head>


<body>


<h1>
  🎤 Pronunciation Mystery Picture
</h1>


<div class="instructions">

  Watch for the highlighted word.<br>
  Say it correctly to reveal the picture!

</div>


<div id="warning"></div>


<button id="startButton">
  🎤 Start Game
</button>


<div id="currentTask">
  Click Start Game to begin.
</div>


<button id="speakButton">
  🎤 Say the Word
</button>


<div id="result"></div>


<div id="game"></div>


<div id="message"></div>


<div id="progress"></div>


<div id="finishedMessage">
  🎉 Challenge Completed! Great job!
</div>



<script>


/* =========================================================
   ⭐ 老師的單字表
   ========================================================= */

const words = [

  "think",
  "thank",
  "three",
  "the",
  "this",
  "that",

  "time",
  "name",
  "same",
  "game",
  "phone",
  "done",

  "fun",
  "man",
  "moon",
  "money",
  "problem",
  "sometimes",

  "gift",
  "past",
  "next",
  "world",
  "word",
  "first",

  "friend",
  "school",
  "student",
  "English",
  "practice",
  "speak"

];



/* =========================================================
   ⭐ Azure Function
   ========================================================= */

const FUNCTION_URL =
  "https://yvonne-pronunciation-api-c4gvc3hwergxcydd.southeastasia-01.azurewebsites.net/api/pronunciation";



/* =========================================================
   ⭐ PASS 標準
   ========================================================= */

const MIN_ACCURACY = 95;

const MIN_PHONEME_SCORE = 95;



/* =========================================================
   Audio
   ========================================================= */

const TARGET_SAMPLE_RATE = 16000;


let audioContext = null;

let microphoneStream = null;

let sourceNode = null;

let processorNode = null;

let audioChunks = [];

let inputSampleRate = 44100;

let recording = false;

let checking = false;



/* =========================================================
   遊戲變數
   ========================================================= */

let remainingCards = [];

let currentCard = null;

let gameStarted = false;

let completedCount = 0;



/* =========================================================
   HTML 元素
   ========================================================= */

const startButton =
  document.getElementById(
    "startButton"
  );


const speakButton =
  document.getElementById(
    "speakButton"
  );


const currentTask =
  document.getElementById(
    "currentTask"
  );


const resultBox =
  document.getElementById(
    "result"
  );


const messageBox =
  document.getElementById(
    "message"
  );


const progressBox =
  document.getElementById(
    "progress"
  );


const warningBox =
  document.getElementById(
    "warning"
  );


const finishedMessage =
  document.getElementById(
    "finishedMessage"
  );



/* =========================================================
   找出最適合圖片的格子排列
   ========================================================= */

function findBestGrid(total) {

  let bestColumns = total;

  let bestRows = 1;

  let bestDifference =
    Infinity;


  const desiredRatio =
    1.5;


  for (
    let rows = 1;
    rows <= total;
    rows++
  ) {

    if (
      total % rows !== 0
    ) {

      continue;

    }


    const columns =
      total / rows;


    if (
      columns < rows
    ) {

      continue;

    }


    const ratio =
      columns / rows;


    const difference =
      Math.abs(
        ratio -
        desiredRatio
      );


    if (
      difference <
      bestDifference
    ) {

      bestDifference =
        difference;

      bestColumns =
        columns;

      bestRows =
        rows;

    }

  }


  return {

    columns:
      bestColumns,

    rows:
      bestRows

  };

}



/* =========================================================
   建立字卡
   ========================================================= */

function createCards() {

  const game =
    document.getElementById(
      "game"
    );


  game.innerHTML = "";


  const grid =
    findBestGrid(
      words.length
    );


  game.style.gridTemplateColumns =
    `repeat(${grid.columns}, 1fr)`;


  game.style.gridTemplateRows =
    `repeat(${grid.rows}, 1fr)`;


  remainingCards = [];


  completedCount = 0;


  words.forEach(
    function(word) {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "word-card";


      card.textContent =
        word;


      card.dataset.word =
        word;


      game.appendChild(
        card
      );


      remainingCards.push(
        card
      );

    }
  );


  updateProgress();

}



/* =========================================================
   Start Game
   ========================================================= */

startButton.addEventListener(
  "click",
  async function() {

    hideWarning();


    try {

      const permissionStream =
        await navigator.mediaDevices
          .getUserMedia({
            audio: true
          });


      permissionStream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

    }

    catch(error) {

      showWarning(
        "🚫 Microphone permission is required. " +
        "Please allow microphone access and try again."
      );

      return;

    }


    gameStarted =
      true;


    startButton.style.display =
      "none";


    speakButton.style.display =
      "inline-block";


    finishedMessage.style.display =
      "none";


    resultBox.textContent =
      "";


    messageBox.textContent =
      "";


    chooseRandomWord();

  }
);



/* =========================================================
   隨機挑下一個單字
   ========================================================= */

function chooseRandomWord() {

  if (
    remainingCards.length === 0
  ) {

    finishGame();

    return;

  }


  if (currentCard) {

    currentCard.classList.remove(
      "active"
    );

  }


  const randomIndex =
    Math.floor(
      Math.random() *
      remainingCards.length
    );


  currentCard =
    remainingCards[
      randomIndex
    ];


  currentCard.classList.add(
    "active"
  );


  currentTask.textContent =
    "🎯 Say the highlighted word!";


  resultBox.textContent =
    "";


  resultBox.className =
    "";


  messageBox.textContent =
    "Press the microphone button when you're ready.";


  speakButton.textContent =
    "🎤 Say the Word";


  speakButton.className =
    "";


  speakButton.disabled =
    false;

}



/* =========================================================
   錄音按鈕
   ========================================================= */

speakButton.addEventListener(
  "click",
  async function() {

    if (
      !gameStarted ||
      !currentCard ||
      checking
    ) {

      return;

    }


    if (!recording) {

      await startRecording();

    }

    else {

      await stopRecordingAndCheck();

    }

  }
);



/* =========================================================
   開始錄音
   ========================================================= */

async function startRecording() {

  hideWarning();


  resultBox.textContent =
    "";


  resultBox.className =
    "";


  audioChunks = [];


  try {

    microphoneStream =
      await navigator.mediaDevices
        .getUserMedia({

          audio: {

            echoCancellation:
              false,

            noiseSuppression:
              false,

            autoGainControl:
              false

          }

        });


    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();


    inputSampleRate =
      audioContext.sampleRate;


    sourceNode =
      audioContext
        .createMediaStreamSource(
          microphoneStream
        );


    processorNode =
      audioContext
        .createScriptProcessor(
          4096,
          1,
          1
        );


    processorNode.onaudioprocess =
      function(event) {

        if (!recording) {

          return;

        }


        const input =
          event
            .inputBuffer
            .getChannelData(0);


        audioChunks.push(
          new Float32Array(
            input
          )
        );

      };


    sourceNode.connect(
      processorNode
    );


    processorNode.connect(
      audioContext.destination
    );


    recording =
      true;


    speakButton.textContent =
      "■ Check Pronunciation";


    speakButton.className =
      "recording";


    messageBox.textContent =
      "🔴 Recording... Say the highlighted word once.";

  }

  catch(error) {

    showWarning(
      "Microphone error: " +
      error.message
    );

  }

}



/* =========================================================
   停止錄音 + 評分
   ========================================================= */

async function stopRecordingAndCheck() {

  if (!recording) {

    return;

  }


  recording =
    false;


  checking =
    true;


  speakButton.disabled =
    true;


  speakButton.className =
    "";


  speakButton.textContent =
    "⏳ Checking...";


  messageBox.textContent =
    "Checking your pronunciation...";


  resultBox.textContent =
    "⏳";


  resultBox.className =
    "checking";


  stopAudioDevices();


  const combined =
    mergeBuffers(
      audioChunks
    );


  if (
    combined.length === 0
  ) {

    checking =
      false;


    handleTryAgain(
      "I couldn't hear the recording."
    );


    return;

  }


  const downsampled =
    downsampleBuffer(

      combined,

      inputSampleRate,

      TARGET_SAMPLE_RATE

    );


  const wavBuffer =
    encodeWAV(

      downsampled,

      TARGET_SAMPLE_RATE

    );


  const base64Audio =
    arrayBufferToBase64(
      wavBuffer
    );


  if (audioContext) {

    try {

      await audioContext.close();

    }

    catch(error) {

      console.log(error);

    }

  }


  audioContext =
    null;


  await checkPronunciation(
    base64Audio
  );

}



/* =========================================================
   關閉麥克風
   ========================================================= */

function stopAudioDevices() {

  if (microphoneStream) {

    microphoneStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

  }


  if (processorNode) {

    try {

      processorNode.disconnect();

    }

    catch(error) {

      console.log(error);

    }

  }


  if (sourceNode) {

    try {

      sourceNode.disconnect();

    }

    catch(error) {

      console.log(error);

    }

  }


  microphoneStream =
    null;


  processorNode =
    null;


  sourceNode =
    null;

}



/* =========================================================
   傳給 Azure
   ========================================================= */

async function checkPronunciation(
  audioBase64
) {

  if (!currentCard) {

    checking =
      false;

    return;

  }


  const targetWord =
    currentCard.dataset.word;


  try {

    const response =
      await fetch(

        FUNCTION_URL,

        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              referenceText:
                targetWord,

              audioBase64:
                audioBase64

            })

        }

      );


    const responseText =
      await response.text();


    let data;


    try {

      data =
        JSON.parse(
          responseText
        );

    }

    catch(error) {

      throw new Error(
        "The pronunciation service returned an invalid response."
      );

    }


    if (!response.ok) {

      throw new Error(

        data.error ||

        data.details ||

        "Pronunciation service error."

      );

    }


    if (!data.ok) {

      throw new Error(

        data.error ||

        "Pronunciation assessment failed."

      );

    }


    evaluatePronunciation(
      data
    );

  }

  catch(error) {

    checking =
      false;


    resultBox.textContent =
      "⚠️";


    resultBox.className =
      "fail";


    messageBox.textContent =
      "Connection problem. Please try again.";


    speakButton.disabled =
      false;


    speakButton.textContent =
      "🎤 Try Again";


    showWarning(
      error.message
    );

  }

}



/* =========================================================
   Azure 分數判定
   ========================================================= */

function evaluatePronunciation(
  data
) {

  const accuracy =
    Number(
      data.accuracyScore
    );


  const accuracyPass =

    Number.isFinite(
      accuracy
    ) &&

    accuracy >=
      MIN_ACCURACY;



  let phonemeCount =
    0;


  let allPhonemesPass =
    true;


  if (
    Array.isArray(
      data.words
    )
  ) {

    data.words.forEach(
      function(word) {

        if (
          !Array.isArray(
            word.phonemes
          )
        ) {

          return;

        }


        word.phonemes.forEach(
          function(phoneme) {

            phonemeCount++;


            const score =
              Number(
                phoneme.accuracyScore
              );


            if (
              !Number.isFinite(
                score
              )
            ) {

              allPhonemesPass =
                false;

              return;

            }


            if (
              score <
              MIN_PHONEME_SCORE
            ) {

              allPhonemesPass =
                false;

            }

          }

        );

      }

    );

  }


  if (
    phonemeCount === 0
  ) {

    allPhonemesPass =
      false;

  }


  const recognizedWord =
    normalizeText(
      data.recognizedText || ""
    );


  const expectedWord =
    normalizeText(
      currentCard.dataset.word
    );


  const recognizedPass =
    recognizedWord ===
    expectedWord;


  const finalPass =

    accuracyPass &&

    allPhonemesPass &&

    recognizedPass;


  checking =
    false;


  if (finalPass) {

    handlePass();

  }

  else {

    handleTryAgain();

  }

}



/* =========================================================
   PASS
   ========================================================= */

function handlePass() {

  if (!currentCard) {

    return;

  }


  const finishedCard =
    currentCard;


  resultBox.textContent =
    "PASS ✅";


  resultBox.className =
    "pass";


  messageBox.textContent =
    "Great job!";


  speakButton.disabled =
    true;


  speakButton.textContent =
    "✓ Passed";


  finishedCard.classList.remove(
    "active"
  );


  finishedCard.classList.add(
    "completed"
  );


  remainingCards =
    remainingCards.filter(

      function(card) {

        return card !==
          finishedCard;

      }

    );


  completedCount++;


  updateProgress();


  currentCard =
    null;


  setTimeout(

    function() {

      chooseRandomWord();

    },

    1100

  );

}



/* =========================================================
   TRY AGAIN
   ========================================================= */

function handleTryAgain(
  customMessage = ""
) {

  resultBox.textContent =
    "TRY AGAIN ❌";


  resultBox.className =
    "fail";


  if (customMessage) {

    messageBox.textContent =
      customMessage;

  }

  else {

    messageBox.textContent =
      "Try the same word again.";

  }


  speakButton.disabled =
    false;


  speakButton.textContent =
    "🎤 Try Again";


  speakButton.className =
    "";

}



/* =========================================================
   Audio 工具
   ========================================================= */

function mergeBuffers(chunks) {

  let totalLength =
    0;


  chunks.forEach(
    function(chunk) {

      totalLength +=
        chunk.length;

    }
  );


  const result =
    new Float32Array(
      totalLength
    );


  let offset =
    0;


  chunks.forEach(
    function(chunk) {

      result.set(
        chunk,
        offset
      );


      offset +=
        chunk.length;

    }
  );


  return result;

}



/* =========================================================
   Downsample 至 16 kHz
   ========================================================= */

function downsampleBuffer(
  buffer,
  sourceRate,
  targetRate
) {

  if (
    sourceRate ===
    targetRate
  ) {

    return buffer;

  }


  const ratio =
    sourceRate /
    targetRate;


  const newLength =
    Math.round(
      buffer.length /
      ratio
    );


  const result =
    new Float32Array(
      newLength
    );


  let resultIndex =
    0;


  let bufferIndex =
    0;


  while (
    resultIndex <
    result.length
  ) {

    const nextBufferIndex =
      Math.round(

        (resultIndex + 1) *
        ratio

      );


    let total =
      0;


    let count =
      0;


    for (

      let i =
        bufferIndex;

      i <
        nextBufferIndex &&
      i <
        buffer.length;

      i++

    ) {

      total +=
        buffer[i];


      count++;

    }


    result[resultIndex] =

      count > 0

        ? total / count

        : 0;


    resultIndex++;


    bufferIndex =
      nextBufferIndex;

  }


  return result;

}



/* =========================================================
   WAV
   ========================================================= */

function encodeWAV(
  samples,
  sampleRate
) {

  const buffer =
    new ArrayBuffer(

      44 +
      samples.length * 2

    );


  const view =
    new DataView(
      buffer
    );


  writeString(
    view,
    0,
    "RIFF"
  );


  view.setUint32(

    4,

    36 +
    samples.length * 2,

    true

  );


  writeString(
    view,
    8,
    "WAVE"
  );


  writeString(
    view,
    12,
    "fmt "
  );


  view.setUint32(
    16,
    16,
    true
  );


  view.setUint16(
    20,
    1,
    true
  );


  view.setUint16(
    22,
    1,
    true
  );


  view.setUint32(
    24,
    sampleRate,
    true
  );


  view.setUint32(
    28,
    sampleRate * 2,
    true
  );


  view.setUint16(
    32,
    2,
    true
  );


  view.setUint16(
    34,
    16,
    true
  );


  writeString(
    view,
    36,
    "data"
  );


  view.setUint32(

    40,

    samples.length * 2,

    true

  );


  floatTo16BitPCM(
    view,
    44,
    samples
  );


  return buffer;

}



/* =========================================================
   Float → 16-bit PCM
   ========================================================= */

function floatTo16BitPCM(
  view,
  offset,
  samples
) {

  for (

    let i = 0;

    i < samples.length;

    i++,
    offset += 2

  ) {

    const sample =
      Math.max(

        -1,

        Math.min(
          1,
          samples[i]
        )

      );


    view.setInt16(

      offset,

      sample < 0

        ? sample *
          0x8000

        : sample *
          0x7fff,

      true

    );

  }

}



/* =========================================================
   WAV 字串
   ========================================================= */

function writeString(
  view,
  offset,
  string
) {

  for (

    let i = 0;

    i <
      string.length;

    i++

  ) {

    view.setUint8(

      offset + i,

      string.charCodeAt(i)

    );

  }

}



/* =========================================================
   ArrayBuffer → Base64
   ========================================================= */

function arrayBufferToBase64(
  buffer
) {

  const bytes =
    new Uint8Array(
      buffer
    );


  let binary =
    "";


  const chunkSize =
    0x8000;


  for (

    let i = 0;

    i <
      bytes.length;

    i +=
      chunkSize

  ) {

    const chunk =
      bytes.subarray(

        i,

        Math.min(

          i +
          chunkSize,

          bytes.length

        )

      );


    binary +=
      String
        .fromCharCode
        .apply(
          null,
          chunk
        );

  }


  return btoa(
    binary
  );

}



/* =========================================================
   清理 Azure 辨識文字
   ========================================================= */

function normalizeText(text) {

  return String(text)

    .toLowerCase()

    .trim()

    .replace(
      /[^a-z']/g,
      ""
    );

}
