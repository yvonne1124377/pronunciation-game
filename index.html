<script>

/* =========================================================

const words = [

/* =========================================================

const FUNCTION_URL =

/* =========================================================
   PASS 標準
   ========================================================= */

const MIN_WORD_ACCURACY = 80;
const MIN_TARGET_SOUND = 50;


/*
  每個單字真正要檢查的重點音。
  陣列中的每一個音都必須 >= 50。

  注意：
  - 不是「所有 phoneme 都要 80」
  - 只檢查老師指定的 target sound
*/
const TARGET_SOUNDS = {

  think:      ["θ"],
  thank:      ["θ"],
  three:      ["θ"],

  the:        ["ð"],
  this:       ["ð"],
  that:       ["ð"],

  time:       ["m"],
  name:       ["m"],
  same:       ["m"],
  game:       ["m"],

  phone:      ["n"],
  done:       ["n"],
  fun:        ["n"],

  man:        ["m"],
  moon:       ["m"],
  money:      ["m"],
  problem:    ["m"],
  sometimes:  ["m"],

  gift:       ["f", "t"],
  past:       ["s", "t"],
  next:       ["k", "s", "t"],
  world:      ["l", "d"],
  word:       ["d"],

  friend:     ["d"],

};

/*
  Phrase Rescue：
  同一個單字連續失敗 2 次後，
  下一次開始改用短語作為 Azure 的 ReferenceText。

  注意：
  - Azure 評估整個短語
  - 程式最後仍然只抓「目標單字」的 Word Accuracy
    與指定 Target Sound
  - 短語中的其他字完全不計分
*/
const RESCUE_AFTER_FAILS = 2;

const RESCUE_PHRASES = {

  think:      "think again",
  thank:      "thank you",
  three:      "three people",

  the:        "the book",
  this:       "this one",
  that:       "that one",

  time:       "time flies",
  name:       "name tag",
  same:       "same thing",
  game:       "game time",

  phone:      "phone call",
  done:       "done now",
  fun:        "fun game",

  man:        "that man",
  moon:       "full moon",
  money:      "money talks",
  problem:    "big problem",
  sometimes:  "sometimes I do",

  gift:       "gift shop",
  past:       "past tense",
  next:       "next time",
  world:      "world peace",
  word:       "word choice",
  first:      "first time",

  friend:     "best friend",
  school:     "school day",
  student:    "student life",
  English:    "English class",
  practice:   "practice time",
  speak:      "speak clearly"

};




/* =========================================================
   Audio
   ========================================================= */

const TARGET_SAMPLE_RATE = 16000;

let audioContext = null;

let microphoneStream = null;

let sourceNode = null;

let processorNode = null;

let audioChunks = [];

let inputSampleRate = 44100;

let recording = false;

let checking = false;



/* =========================================================

   ========================================================= */

let remainingCards = [];

let currentCard = null;

let currentFailCount = 0;
let rescueMode = false;

/* =========================================================

const startButton =

  document.getElementById(

/* =========================================================
   Grid
   ========================================================= */

function findBestGrid(total) {

  let bestColumns = total;

  let bestRows = 1;

  let bestDifference =
    Infinity;


  const desiredRatio =
    1.5;


  for (
    let rows = 1;
    rows <= total;
    rows++
  ) {

    if (
      total % rows !== 0
    ) {
      continue;
    }


    const columns =
      total / rows;


    if (
      columns < rows
    ) {
      continue;
    }


    const ratio =
      columns / rows;


    const difference =
      Math.abs(
        ratio -
        desiredRatio
      );


    if (
      difference <
      bestDifference
    ) {

      bestDifference =
        difference;

      bestColumns =
        columns;

      bestRows =
        rows;

    }

  }


  return {

    columns:
      bestColumns,

    rows:
      bestRows

  };

}



/* =========================================================
   建立字卡
   ========================================================= */

function createCards() {

  const game =
    document.getElementById(
      "game"
    );


  game.innerHTML = "";


  const grid =
    findBestGrid(
      words.length
    );


  game.style.gridTemplateColumns =
    `repeat(${grid.columns}, 1fr)`;


  game.style.gridTemplateRows =
    `repeat(${grid.rows}, 1fr)`;


  remainingCards = [];

  completedCount = 0;


  words.forEach(
    function(word) {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "word-card";


      card.textContent =
        word;


      card.dataset.word =
        word;


      game.appendChild(
        card
      );


      remainingCards.push(
        card
      );

    }
  );


  updateProgress();

}



/* =========================================================
   Start
   ========================================================= */

startButton.addEventListener(
  "click",
  async function() {

    hideWarning();


    try {

      const permissionStream =
        await navigator.mediaDevices

/* =========================================================
   隨機選字
   ========================================================= */

function chooseRandomWord() {

  if (
    remainingCards.length === 0
  ) {

    finishGame();

    return;

  }


  if (currentCard) {

    currentCard.classList.remove(
      "active"
    );

  }


  const randomIndex =
    Math.floor(
      Math.random() *
      remainingCards.length
    );


  currentCard =
    remainingCards[
      randomIndex
    ];


  currentFailCount = 0;
  rescueMode = false;


  currentCard.classList.add(
    "active"
  );


  currentTask.textContent =
    "🎯 Say the highlighted word!";


  resultBox.textContent =
    "";


  resultBox.className =
    "";


  scoreDetails.textContent =
    "";


  messageBox.textContent =

  speakButton.textContent =

}



/* =========================================================
   錄音按鈕
   ========================================================= */

speakButton.addEventListener(

  async function() {

      !gameStarted ||

      await startRecording();

    }

    else {

      await stopRecordingAndCheck();

/* =========================================================
   開始錄音
   ========================================================= */

async function startRecording() {

  hideWarning();


  resultBox.textContent =
    "";


  resultBox.className =
    "";


  scoreDetails.textContent =
    "";


  audioChunks = [];


  try {

    microphoneStream =
      await navigator.mediaDevices
        .getUserMedia({

          audio: {

            echoCancellation:
              false,

            noiseSuppression:
              false,

            autoGainControl:
              false

          }

        });


    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();


    inputSampleRate =
      audioContext.sampleRate;


    sourceNode =
      audioContext
        .createMediaStreamSource(
          microphoneStream
        );


    processorNode =
      audioContext
        .createScriptProcessor(
          4096,
          1,
          1
        );


    processorNode.onaudioprocess =
      function(event) {

        if (!recording) {
          return;
        }


        const input =
          event
            .inputBuffer
            .getChannelData(0);


        audioChunks.push(
          new Float32Array(
            input
          )
        );

      };


    sourceNode.connect(
      processorNode
    );


    processorNode.connect(
      audioContext.destination
    );


    recording =
      true;


    speakButton.textContent =
      "■ Check Pronunciation";


    speakButton.className =
      "recording";


    const recordingTarget =
      rescueMode
        ? (
            RESCUE_PHRASES[
              currentCard.dataset.word
            ] ||
            currentCard.dataset.word
          )
        : currentCard.dataset.word;


    messageBox.textContent =
      rescueMode
        ? (
            '🔴 Recording... Say: "' +
            recordingTarget +
            '"'
          )
        : "🔴 Recording... Say the highlighted word once.";

  }

  catch(error) {

    showWarning(
      "Microphone error: " +
      error.message
    );

  }

}



/* =========================================================
   停止 + 評分
   ========================================================= */

async function stopRecordingAndCheck() {

  if (!recording) {
    return;
  }


  recording =
    false;


  checking =
    true;


  speakButton.disabled =
    true;


  speakButton.className =
    "";


  speakButton.textContent =
    "⏳ Checking...";


  messageBox.textContent =
    "Checking your pronunciation...";


  resultBox.textContent =
    "⏳";


  resultBox.className =
    "checking";


  stopAudioDevices();


  const combined =
    mergeBuffers(
      audioChunks
    );


  if (
    combined.length === 0
  ) {

    checking =
      false;


    handleTryAgain(
      "I couldn't hear the recording.",
      false
    );


    return;

  }


  const downsampled =
    downsampleBuffer(

      combined,

      inputSampleRate,

      TARGET_SAMPLE_RATE

    );


  const wavBuffer =
    encodeWAV(

      downsampled,

      TARGET_SAMPLE_RATE

    );


  const base64Audio =
    arrayBufferToBase64(
      wavBuffer
    );


  if (audioContext) {

    try {

      await audioContext.close();

    }

    catch(error) {

      console.log(error);

    }

  }


  audioContext =
    null;


  await checkPronunciation(
    base64Audio
  );

}



/* =========================================================
   關閉錄音
   ========================================================= */

function stopAudioDevices() {

  if (microphoneStream) {

    microphoneStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

  }


  if (processorNode) {

    try {
      processorNode.disconnect();
    }

    catch(error) {
      console.log(error);
    }

  }


  if (sourceNode) {

    try {
      sourceNode.disconnect();
    }

    catch(error) {
      console.log(error);
    }

  }


  microphoneStream =
    null;


  processorNode =
    null;


  sourceNode =
    null;

}



/* =========================================================
   Azure
   ========================================================= */

async function checkPronunciation(
  audioBase64
) {

  if (!currentCard) {

    checking =
      false;

    return;

  }


  const targetWord =
    currentCard.dataset.word;


  const referenceText =
    rescueMode
      ? (
          RESCUE_PHRASES[
            targetWord
          ] ||
          targetWord
        )
      : targetWord;


  try {

    const response =
      await fetch(

        FUNCTION_URL,

        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              referenceText:
                referenceText,

              audioBase64:
                audioBase64

            })

        }

      );


    const responseText =
      await response.text();


    let data;


    try {

      data =
        JSON.parse(
          responseText
        );

    }

    catch(error) {

      throw new Error(
        "The pronunciation service returned an invalid response."
      );

    }


    if (!response.ok) {

      throw new Error(

        data.error ||

        data.details ||

        "Pronunciation service error."

      );

    }


    if (!data.ok) {

      throw new Error(

        data.error ||

        "Pronunciation assessment failed."

      );

    }


    evaluatePronunciation(
      data
    );

  }

  catch(error) {

    checking =
      false;


    resultBox.textContent =
      "⚠️";


    resultBox.className =
      "fail";


    scoreDetails.textContent =
      "";


    messageBox.textContent =
      "Connection problem. Please try again.";


    speakButton.disabled =
      false;


    speakButton.textContent =
      rescueMode
        ? "🎤 Say the Phrase"
        : "🎤 Try Again";


    showWarning(
      error.message
    );

  }

}



/* =========================================================
   ⭐ 發音判定
   ========================================================= */

function normalizeText(text) {

  return String(text || "")
    .toLowerCase()
    .replace(/[^a-z']/g, "");

}


function normalizePhoneme(symbol) {

  return String(symbol || "")
    .trim()
    .replace(/[ˈˌ.]/g, "");

}


function findTargetWordResult(data, targetWord) {

  if (!Array.isArray(data.words)) {
    return null;
  }


  const target =
    normalizeText(targetWord);


  /*
    允許學生：
    1. 單獨念目標字
    2. 念一個包含目標字的短語

    例如字卡是 same：
    "same" 或 "same thing" 都可以。

    我們只抓 Azure 回傳中 same 這個 word 的分數，
    其他單字完全不參與 PASS / FAIL。
  */

  for (const word of data.words) {

    if (
      normalizeText(word.word) ===
      target
    ) {
      return word;
    }

  }


  return null;

}


function findTargetPhonemes(wordResult, requiredSounds) {

  const phonemes =
    Array.isArray(wordResult?.phonemes)
      ? wordResult.phonemes
      : [];


  const usedIndexes =
    new Set();


  const matches =
    [];


  for (const requiredSound of requiredSounds) {

    const wanted =
      normalizePhoneme(requiredSound);


    let foundIndex =
      -1;


    for (
      let i = 0;
      i < phonemes.length;
      i++
    ) {

      if (usedIndexes.has(i)) {
        continue;
      }


      const actual =
        normalizePhoneme(
          phonemes[i].phoneme
        );


      if (actual === wanted) {

        foundIndex = i;
        break;

      }

    }


    if (foundIndex === -1) {

      matches.push({

        symbol:
          requiredSound,

        score:
          null,

        found:
          false

      });

      continue;

    }


    usedIndexes.add(
      foundIndex
    );


    const score =
      Number(
        phonemes[
          foundIndex
        ].accuracyScore
      );


    matches.push({

      symbol:
        requiredSound,

      score:
        Number.isFinite(score)
          ? score
          : null,

      found:
        true

    });

  }


  return matches;

}


function evaluatePronunciation(data) {

  const targetWord =
    currentCard
      ? currentCard.dataset.word
      : "";


  const wordResult =
    findTargetWordResult(
      data,
      targetWord
    );


  /*
    如果 Azure 在回傳的 Words 中找不到目標字，
    就不能通過。

    這也避免學生只念別的單字就過關。
  */

  const wordAccuracy =
    Number(
      wordResult?.accuracyScore
    );


  const wordPass =

    Boolean(wordResult) &&

    Number.isFinite(
      wordAccuracy
    ) &&

    wordAccuracy >=
      MIN_WORD_ACCURACY;


  const requiredSounds =
    TARGET_SOUNDS[
      targetWord
    ] || [];


  const targetResults =
    wordResult
      ? findTargetPhonemes(
          wordResult,
          requiredSounds
        )
      : [];


  const targetPass =

    requiredSounds.length > 0 &&

    targetResults.length ===
      requiredSounds.length &&

    targetResults.every(
      function(item) {

        return (
          item.found &&
          Number.isFinite(
            item.score
          ) &&
          item.score >=
            MIN_TARGET_SOUND
        );

      }
    );


  /*
    正式 PASS 標準：

    1. Azure 的 Words 中必須找到目標字
    2. 該目標字 Word Accuracy >= 80
    3. 老師指定的每一個 Target Sound >= 50

    其他 phoneme 不影響 PASS / FAIL。
  */

  const finalPass =
    wordPass &&
    targetPass;


  checking =
    false;


  const recognizedDisplay =
    data.recognizedText
      ? data.recognizedText
      : "-";


  const wordAccuracyDisplay =
    Number.isFinite(
      wordAccuracy
    )
      ? Math.round(
          wordAccuracy
        )
      : "-";


  let targetDisplay =
    "no target data";


  if (
    targetResults.length > 0
  ) {

    targetDisplay =
      targetResults
        .map(
          function(item) {

            return (
              "/" +
              item.symbol +
              "/ " +
              (
                Number.isFinite(
                  item.score
                )
                  ? Math.round(
                      item.score
                    )
                  : "-"
              )
            );

          }
        )
        .join(" · ");

  }


  /*
    測試階段保留完整 phoneme 資訊，
    方便老師觀察 Azure 評分。
  */

  let allPhonemeDisplay =
    "no data";


  if (
    wordResult &&
    Array.isArray(
      wordResult.phonemes
    ) &&
    wordResult.phonemes.length > 0
  ) {

    allPhonemeDisplay =
      wordResult.phonemes
        .map(
          function(phoneme) {

            const score =
              Number(
                phoneme.accuracyScore
              );


            return (
              "/" +
              (
                phoneme.phoneme ||
                "?"
              ) +
              "/ " +
              (
                Number.isFinite(score)
                  ? Math.round(score)
                  : "-"
              )
            );

          }
        )
        .join(" · ");

  }


  scoreDetails.textContent =

    "Recognized: " +
    recognizedDisplay +

    " | Word: " +
    targetWord +

    " " +
    wordAccuracyDisplay +

    " | Target: " +
    targetDisplay +

    " | All phonemes: " +
    allPhonemeDisplay;


  if (!wordResult) {

    messageBox.textContent =
      'I could not find "' +
      targetWord +
      '" in what you said. Try the word again, or say a short phrase containing it.';

  }

  else if (!wordPass) {

    messageBox.textContent =
      "Word Accuracy needs 80 or higher.";

  }

  else if (!targetPass) {

    messageBox.textContent =
      "Target sound needs 50 or higher.";

  }


  if (finalPass) {

    handlePass();

  }

  else {

    handleTryAgain();

  }

}

/* =========================================================
   PASS
   ========================================================= */

function handlePass() {

  if (!currentCard) {
    return;
  }


  const finishedCard =
    currentCard;


  resultBox.textContent =
    "PASS ✅";


  resultBox.className =
    "pass";


  messageBox.textContent =
    "Great job!";


  speakButton.disabled =
    true;


  speakButton.textContent =
    "✓ Passed";


  finishedCard.classList.remove(
    "active"
  );


  finishedCard.classList.add(
    "completed"
  );


  remainingCards =
    remainingCards.filter(

      function(card) {

        return card !==
          finishedCard;

      }

    );


  completedCount++;


  updateProgress();


  currentFailCount = 0;
  rescueMode = false;


  currentCard =
    null;


  setTimeout(

    function() {

      chooseRandomWord();

    },

    1400

  );

}



/* =========================================================
   TRY AGAIN
   ========================================================= */

function handleTryAgain(
  customMessage = "",
  countFailure = true
) {

  resultBox.textContent =
    "TRY AGAIN ❌";


  resultBox.className =
    "fail";


  /*
    只有真正的 pronunciation FAIL 才累計。
    麥克風沒錄到、連線錯誤等技術問題不計。
  */

  if (
    countFailure &&
    currentCard
  ) {

    currentFailCount++;

  }


  /*
    同一個字失敗 2 次後，自動進入 Phrase Rescue Mode。
  */

  if (
    currentCard &&
    currentFailCount >=
      RESCUE_AFTER_FAILS
  ) {

    rescueMode =
      true;

  }


  if (customMessage) {

    messageBox.textContent =
      customMessage;

  }

  else if (
    rescueMode &&
    currentCard
  ) {

    const targetWord =
      currentCard.dataset.word;


    const rescuePhrase =
      RESCUE_PHRASES[
        targetWord
      ] ||
      targetWord;


    messageBox.textContent =
      'Phrase rescue: say "' +
      rescuePhrase +
      '". Only "' +
      targetWord +
      '" will be scored.';

  }

  else {

    const triesLeft =
      Math.max(
        0,
        RESCUE_AFTER_FAILS -
        currentFailCount
      );


    messageBox.textContent =
      triesLeft === 1
        ? "Try the same word again. One more miss will unlock a short phrase."
        : "Try the same word again.";

  }


  /*
    不換 currentCard。
    所以原本黃色字繼續亮。
  */

  speakButton.disabled =
    false;


  speakButton.textContent =
    rescueMode
      ? "🎤 Say the Phrase"
      : "🎤 Try Again";


  speakButton.className =
    "";

}


/* =========================================================
   合併錄音
   ========================================================= */

function mergeBuffers(chunks) {

  let totalLength =
    0;


  chunks.forEach(
    function(chunk) {

      totalLength +=
        chunk.length;

    }
  );


  const result =
    new Float32Array(
      totalLength
    );


  let offset =
    0;


  chunks.forEach(
    function(chunk) {

      result.set(
        chunk,
        offset
      );


      offset +=
        chunk.length;

    }
  );


  return result;

}



/* =========================================================
   Downsample
   ========================================================= */

function downsampleBuffer(
  buffer,
  sourceRate,
  targetRate
) {

  if (
    sourceRate ===
    targetRate
  ) {

    return buffer;

  }


  const ratio =
    sourceRate /
    targetRate;


  const newLength =
    Math.round(
      buffer.length /
      ratio
    );


  const result =
    new Float32Array(
      newLength
    );


  let resultIndex =
    0;


  let bufferIndex =
    0;


  while (
    resultIndex <
    result.length
  ) {

    const nextBufferIndex =
      Math.round(

        (resultIndex + 1) *
        ratio

      );


    let total =
      0;


    let count =
      0;


    for (

      let i =
        bufferIndex;

      i <
        nextBufferIndex &&
      i <
        buffer.length;

      i++

    ) {

      total +=
        buffer[i];

      count++;

    }


    result[resultIndex] =

      count > 0

        ? total / count

        : 0;


    resultIndex++;


    bufferIndex =
      nextBufferIndex;

  }


  return result;

}



/* =========================================================
   WAV
   ========================================================= */

function encodeWAV(
  samples,
  sampleRate
) {

  const buffer =
    new ArrayBuffer(

      44 +
      samples.length * 2

    );


  const view =
    new DataView(
      buffer
    );


  writeString(
    view,
    0,
    "RIFF"
  );


  view.setUint32(

    4,

    36 +
    samples.length * 2,

    true

  );


  writeString(
    view,
    8,
    "WAVE"
  );


  writeString(
    view,
    12,
    "fmt "
  );


  view.setUint32(
    16,
    16,
    true
  );


  view.setUint16(
    20,
    1,
    true
  );


  view.setUint16(
    22,
    1,
    true
  );


  view.setUint32(
    24,
    sampleRate,
    true
  );


  view.setUint32(
    28,
    sampleRate * 2,
    true
  );


  view.setUint16(
    32,
    2,
    true
  );


  view.setUint16(
    34,
    16,
    true
  );


  writeString(
    view,
    36,
    "data"
  );


  view.setUint32(

    40,

    samples.length * 2,

    true

  );


  floatTo16BitPCM(
    view,
    44,
    samples
  );


  return buffer;

}



/* =========================================================
   PCM
   ========================================================= */

function floatTo16BitPCM(
  view,
  offset,
  samples
) {

  for (

    let i = 0;

    i < samples.length;

    i++,
    offset += 2

  ) {

    const sample =
      Math.max(

        -1,

        Math.min(
          1,
          samples[i]
        )

      );


    view.setInt16(

      offset,

      sample < 0

        ? sample *
          0x8000

        : sample *
          0x7fff,

      true

    );

  }

}



/* =========================================================
   WAV header
   ========================================================= */

function writeString(
  view,
  offset,
  string
) {

  for (

    let i = 0;

    i <
      string.length;

    i++

  ) {

    view.setUint8(

      offset + i,

      string.charCodeAt(i)

    );

  }

}



/* =========================================================
   Base64
   ========================================================= */

function arrayBufferToBase64(
  buffer
) {

  const bytes =
    new Uint8Array(
      buffer
    );


  let binary =
    "";


  const chunkSize =
    0x8000;


  for (

    let i = 0;

    i <
      bytes.length;

    i +=
      chunkSize

  ) {

    const chunk =
      bytes.subarray(

        i,

        Math.min(

          i +
          chunkSize,

          bytes.length

        )

      );


    binary +=
      String
        .fromCharCode
        .apply(
          null,
          chunk
        );

  }


  return btoa(
    binary
  );

}



/* =========================================================
   Progress
   ========================================================= */

function updateProgress() {

  progressBox.textContent =

    "Completed: " +

    completedCount +

    " / " +

    words.length;

}



/* =========================================================
   完成
   ========================================================= */

function finishGame() {

  gameStarted =
    false;


  currentCard =
    null;


  speakButton.style.display =
    "none";


  currentTask.textContent =
    "🎉 Challenge Completed!";


  resultBox.textContent =
    "🏆";


  resultBox.className =
    "pass";


  scoreDetails.textContent =
    "";


  messageBox.textContent =
    "You revealed the mystery picture!";


  progressBox.textContent =

    words.length +

    " / " +

    words.length +

    " words completed";


  finishedMessage.style.display =
    "block";

}



/* =========================================================
   Warning
   ========================================================= */

function showWarning(message) {

  warningBox.style.display =
    "block";


  warningBox.textContent =
    message;

}


function hideWarning() {

  warningBox.style.display =
    "none";


  warningBox.textContent =
    "";

}



/* =========================================================
   建立遊戲
   ========================================================= */

createCards();
